services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_intelligence
    ports:
      - '5432:5432'
    volumes:
      - job_intelligence_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d job_intelligence']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job_intelligence_postgres:
