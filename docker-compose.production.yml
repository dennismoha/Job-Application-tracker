services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - job_intelligence_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema:
    build: .
    # v1 ships without a generated migration history because package installation
    # is environment-specific. Bootstrap the schema once with db push, then create
    # and commit a baseline Prisma migration before subsequent production upgrades.
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-job_intelligence}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["node", "dist/server.js"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-job_intelligence}?schema=public
      SCHEDULER_ENABLED: "false"
    depends_on:
      schema:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-job_intelligence}?schema=public
      SCHEDULER_ENABLED: "true"
      WORKER_ID: ${WORKER_ID:-production-worker-1}
    depends_on:
      schema:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  job_intelligence_postgres:
